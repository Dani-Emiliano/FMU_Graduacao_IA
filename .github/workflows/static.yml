# Gera o site a partir dos .md do repositório e publica no GitHub Pages.
# Roda sozinho a cada push na main (ex.: quando uma disciplina nova é enviada).
name: Gerar e publicar o site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências do gerador
        run: pip install markdown-it-py mdit-py-plugins pygments

      - name: Gerar o site (CONFIG + descoberta automática das pastas Semestre_N)
        run: python site/build_site.py

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar a pasta site
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
